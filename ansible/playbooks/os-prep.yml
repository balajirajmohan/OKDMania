---
# ===========================================================================
# Phase 2 skeleton: baseline OS preparation for the OKD nodes.
# ===========================================================================
# This is a STARTING POINT, not a finished OKD prerequisite role. It does the
# safe, universal bits (hostname, time sync, base packages). The OKD-specific
# work (kernel params, DNS for api/api-int/*.apps, SELinux, firewall/NM config,
# CRI-O, kubelet) depends on the install method the team locks - see the root
# README decision log (D031 UPI) and docs/sandbox-findings.md.
#
#   cd ansible && ansible-playbook playbooks/os-prep.yml --limit okd_cluster
# ===========================================================================
- name: Baseline OS prep for OKD nodes
  hosts: okd_cluster
  become: true
  gather_facts: true

  tasks:
    - name: Set hostname to the inventory name
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: Ensure chrony is installed
      ansible.builtin.package:
        name: chrony
        state: present

    - name: Enable and start time synchronisation
      ansible.builtin.service:
        name: chronyd
        state: started
        enabled: true

    - name: Install base troubleshooting tools (Fedora)
      ansible.builtin.dnf:
        name:
          - bind-utils
          - tcpdump
          - git
          - jq
        state: present
      when: ansible_os_family == "RedHat"

    # --- TODO (Phase 2, tie to a README decision row) --------------------
    # - name: Kernel params for Kubernetes networking
    #   ansible.posix.sysctl: { name: net.ipv4.ip_forward, value: "1", sysctl_set: true }
    # - name: Configure /etc/hosts or CoreDNS for api / api-int / *.apps
    # - name: SELinux booleans / container policy
    # - name: firewalld or NetworkManager config for the SDN/OVN overlay
    - name: Placeholder for OKD-specific prerequisites
      ansible.builtin.debug:
        msg: >-
          OKD prerequisites are method-specific. Fill this in once the install
          path is locked (root README D031 = AWS UPI). See docs/sandbox-findings.md.
