---
# SSM is the primary transport - no inbound SSH needed for Ansible.
# Fully-qualified plugin name: the short "aws_ssm" name isn't reliably
# resolvable once the plugin lives in a collection.
# https://docs.ansible.com/projects/ansible/latest/collections/amazon/aws/aws_ssm_connection.html
ansible_connection: community.aws.aws_ssm
ansible_aws_ssm_region: us-east-1

# Only needed if a playbook copies files to/from a host (aws_ssm uses S3 or
# SSM's own file transfer for that). Uncomment and set to an S3 bucket you
# control if you hit "S3 bucket name not specified" errors.
# ansible_aws_ssm_bucket_name: okd-ansible-ssm-transfer
